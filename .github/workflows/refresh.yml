name: Refresh public repository inventory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Refresh inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_github.py
      - name: Verify index
        run: python -m unittest discover -s tests -v
      - name: Commit changed inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/github-repositories.json
          if git diff --cached --quiet; then
            echo "No inventory changes"
          else
            git commit -m "chore: refresh public repository inventory"
            git push
          fi
